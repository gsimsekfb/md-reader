[package]
name = "md-reader"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.36", features = ["glow"] }
egui = "0.36"
egui_extras = "0.36"
egui_commonmark = { version = "0.25", features = ["better_syntax_highlighting"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
